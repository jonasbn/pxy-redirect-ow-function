name: Update App

on:
 push:
   branches: [main]

permissions:
  contents: read

jobs:
  deploy-app:
    runs-on: ubuntu-latest
    environment:
      name: production
    env:
      HEARTBEAT_TOKEN: ${{ secrets.HEARTBEAT_TOKEN }}
      HEARTBEAT_TARGET: ${{ vars.HEARTBEAT_TARGET }}
      HEARTBEAT_TARGET_TIMEOUT: ${{ vars.HEARTBEAT_TARGET_TIMEOUT }}
      LOG_DESTINATIONS: ${{ secrets.LOG_DESTINATIONS }}
      LOG_LEVEL: ${{ vars.LOG_LEVEL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version-file: packages/pxy/redirect/go.mod
      - name: Vet
        working-directory: packages/pxy/redirect
        run: go vet ./...
      - name: Install staticcheck
        working-directory: packages/pxy/redirect
        run: go install honnef.co/go/tools/cmd/staticcheck@2023.1.7
      - name: Run staticcheck
        working-directory: packages/pxy/redirect
        run: staticcheck ./...
      - name: Test
        working-directory: packages/pxy/redirect
        run: go test ./...
      - name: Install doctl
        uses: digitalocean/action-doctl@3cb3953159719656269e044e0e24ca16dd2a690f # v2.5.2
        with:
          token: ${{ secrets.DIGITAL_OCEAN_ACCESS_TOKEN }}
      - name: Install the serverless extension for doctl and connect
        run: doctl serverless install && doctl serverless connect fn-a7240b26-c6c7-46df-808a-71fac192afd8 --access-key ${{ secrets.DIGITAL_OCEAN_FUNCTIONS_ACCESS_KEY }}
      - name: Deploy the serverless function
        run: doctl serverless deploy .
