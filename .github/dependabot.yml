version: 2
updates:
  - package-ecosystem: "github-actions"
    # Look for `.github/workflows` in the `root` directory
    directory: "/"
    # Check for updates once a week
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
  - package-ecosystem: "gomod"
    # The Go module (go.mod) lives in the function directory, not in the root
    directory: "/packages/pxy/redirect"
    # Check for updates once a week
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
